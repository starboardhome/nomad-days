name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 1 * *' # monthly: fail if any rules file is overdue for review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Rules
        run: npm run rules:check -- ${{ github.event_name == 'schedule' && '--strict' || '' }}
      - name: Unit tests
        run: npm run test:unit
      - name: Type-check
        run: npm run typecheck
      - name: iOS project adopts the UIScene life cycle (required by the iOS 27 SDK)
        run: |
          npx expo prebuild --platform ios --no-install
          bash scripts/ci/check-ios-scene.sh
      - name: Changelogs for this release (incl. F-Droid's per-ABI version codes)
        run: node scripts/ci/check-changelogs.mjs
      - name: Dependency audit (high/critical, minus documented exceptions)
        run: node scripts/ci/audit.mjs
