name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 1 * *' # monthly: fail if any rules file is overdue for review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Rules
        run: npm run rules:check -- ${{ github.event_name == 'schedule' && '--strict' || '' }}
      - name: Domain tests
        run: npm run test:domain
      - name: Type-check
        run: npm run typecheck
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
