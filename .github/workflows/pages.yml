name: Website

# Publishes the privacy policy (docs/PRIVACY.md, the single source of truth) and a small home page
# to GitHub Pages: https://starboardhome.github.io/nomad-days/
on:
  push:
    branches: [main]
    paths: ['docs/PRIVACY.md', 'site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble site
        run: |
          mkdir -p _src
          cp -r site/. _src/
          { printf -- '---\nlayout: default\ntitle: Privacy policy\npermalink: /privacy/\n---\n\n'; cat docs/PRIVACY.md; } > _src/privacy.md
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./_src
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}privacy/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
