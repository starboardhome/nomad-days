Builds:
  - versionName: 1.0.1
    versionCode: 2001
    commit: a0bae69f0dc8438f220c3672bf1e61c2c2aeb3a4
    sudo:
      - apt-get update
      - apt-get install -y curl
      - curl -Lo node.tar.gz https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.gz
      - echo "6e1db87ef58b8819e5d5402eff1536491b18edd8eb7bee5ef7897876e88dc5ff node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - sed -i -e '1a "expo":{"autolinking":{"android":{"buildFromSource":[".*"]}}},'
        package.json
      - npm ci --loglevel=error
      - sdkmanager 'cmake;3.22.1'
      - sed -i -e '/JavaVersion\|jvmToolchain/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - find node_modules -path '*/android/build.gradle*' -exec sed -i -e "s/jvmTarget
        = '17'/jvmTarget = '21'/" -e 's/JvmTarget.fromTarget("17")/JvmTarget.fromTarget("21")/'
        -e 's/JvmTarget.JVM_17/JvmTarget.JVM_21/' -e '/JavaVersion/s/17/21/' {} +
      - npx expo prebuild --platform android --no-install
      - sed -i -e '/signingConfig /d' android/app/build.gradle
      - sed -i 's/versionCode \([0-9][0-9]*\)/versionCode (\1 * 1000 + 1)/' android/app/build.gradle
      - sed -i '/reactNativeArchitectures=/d' android/gradle.properties
      - echo 'reactNativeArchitectures=armeabi-v7a' >> android/gradle.properties
      - printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g\norg.gradle.workers.max=2\n'
        >> android/gradle.properties
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/@react-native-masked-view/masked-view/android/build.gradle
    scandelete:
      - node_modules
    build:
      - cd android/app
      - gradle assembleRelease
    ndk: 27.1.12297006

