MaintainerNotes: |-
  android/ is generated by `expo prebuild` at build time (Continuous Native Generation),
  so checkupdates reads the version from app.json. Expo modules are built from source
  (autolinking buildFromSource) instead of their prebuilt local-maven-repo AARs.
  Reminders use WorkManager locally; there is no Firebase or Google Play Services code.
  Per-ABI APKs: versionCode 1000*upstream + 1/2/3 for armeabi-v7a/arm64-v8a/x86_64
  (a universal APK is 131 MB, one ABI about 45 MB).

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v\d+\.\d+\.\d+$
VercodeOperation:
  - 1000 * %c + 1
  - 1000 * %c + 2
  - 1000 * %c + 3
UpdateCheckData: app.json|"versionCode":\s*(\d+)|.|"version":\s*"([^"]+)"
